[project]
name = "coc-cardwright"
version = "0.1.0"
description = "COC 7th Edition 480-point buy character card CLI"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.0",
]

[project.scripts]
coc = "coc_generator.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
